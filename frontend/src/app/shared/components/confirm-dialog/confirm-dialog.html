<dialog #dialogo aria-labelledby="dialog-title"
        aria-describedby="dialog-message"
        (cancel)="$event.preventDefault(); cerrar()">

  <h2 id="dialog-title">{{ titulo() }}</h2>
  <p id="dialog-message">{{ mensaje() }}</p>

  <div class="actions">
    <button type="button" class="btn btn-outline" (click)="cerrar()" autofocus>
      Cancelar
    </button>
    <button type="button" class="btn btn-primary" (click)="aceptar()">
      Confirmar
    </button>
  </div>

</dialog>
